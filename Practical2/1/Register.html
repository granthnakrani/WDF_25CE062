    <main>
        
<section>
    <h2>Create Student Account</h2>
    <form action="#" method="post">
        <fieldset>
            <legend>Registration Details</legend>
            <label for="student-name">Full Name</label>
            <input id="student-name" name="name" type="text" placeholder="Full Name" required>

            <label for="student-email">Email Address</label>
            <input id="student-email" name="email" type="email" placeholder="student@example.com" required>

            <label for="student-password">Password</label>
            <input id="student-password" name="password" type="password" placeholder="Create a password" required>

            <input type="submit" value="Register">
        </fieldset>
    </form>
    <p class="actions">Already registered? <a href="Login.html">Go to Login</a></p>
</section>

    </main>
