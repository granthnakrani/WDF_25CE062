<section>
    <h2>Admin Account Registration</h2>
    <form action="#" method="post">
        <fieldset>
            <legend>Administrator Details</legend>
            <label for="admin-username">Username</label>
            <input id="admin-username" name="username" type="text" placeholder="Full Name" required>

            <label for="admin-email">Email Address</label>
            <input id="admin-email" name="email" type="email" placeholder="admin@example.com" required>

            <label for="admin-password">Password</label>
            <input id="admin-password" name="password" type="password" placeholder="Password" required>

            <input type="submit" value="Register">
        </fieldset>
    </form>
</section>
